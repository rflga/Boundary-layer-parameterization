[master]
npx=24
npy=16

[grid]
itot=480
jtot=480
ktot=240

xsize=10080.
ysize=10080.
zsize=2640.

swspatialorder=2

[advec]
cflmax=0.5
fluxlimit_list=thl,qt
swadvec=2i5

[diff]
swdiff=smag2
dnmax=0.1

[thermo]
swthermo=moist
swbasestate=boussinesq
thref0=300.
thvref0 = 300.
pbot=100000.

[micro]
swmicro=2mom_warm
Nc0=1e8
Ni0=0

[budget]
swbudget=1

[cross]
swcross = true
sampletime = 600
crosslist = rr_bot

[force]
swlspres=geo
fc=1e-4
swls=0
swwls=0

[boundary]
mbcbot=noslip
mbctop=freeslip
swboundary=surface
z0m=0.1
z0h=0.1

sbcbot=flux
sbctop=neumann
sbot=0.0
stop=0.0
sbot[thl]=0.05
stop[thl]=0.0
sbot[qt]=5e-5
stop[qt]=0.0

[fields]
visc=1.e-5
svisc=1.e-5
rndseed=2
rndamp[thl]=0.1         
rndamp[qt]=1e-4 
rndz=300.
rndexp=2.

[buffer]
swbuffer=1
zstart=2000.
sigma=0.00223
beta=2.

[time]
endtime=14400
dt=6.
dtmax=60.
savetime=7200
outputiter=50
adaptivestep=true
starttime=0
rkorder=3

[stats]
swstats=1
sampletime=60

[dump]
swdump=1
sampletime=3600
dumplist=qt,ql,thl,u,v,w
